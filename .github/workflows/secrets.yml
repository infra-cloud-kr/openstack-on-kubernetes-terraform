name: Secret checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject tracked private files
        run: |
          found=0
          while IFS= read -r -d '' file; do
            case "${file##*/}" in
              .env.example) continue ;;
              *.tfstate|*.tfstate.*|*.tfvars|*.tfvars.json|*.pem|*.key|id_rsa*|.env|.env.*|credentials|aws-credentials*)
                printf 'Private file must not be tracked: %s\n' "$file"
                found=1 ;;
            esac
          done < <(git ls-files -z)
          exit "$found"
      - name: Install Gitleaks
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan current tracked files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/secret-scan"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/secret-scan"
          gitleaks dir "$RUNNER_TEMP/secret-scan" --redact --no-banner
      - name: Scan Git history
        if: ${{ !cancelled() }}
        run: gitleaks git . --redact --no-banner
